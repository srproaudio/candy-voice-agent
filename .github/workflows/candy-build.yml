name: Candy Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      os:
        description: "JSON array of runner labels"
        required: false
        default: '["macos-latest","windows-latest","ubuntu-latest"]'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os || '["macos-latest","windows-latest","ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri App
        env:
          CI: "false"
          CMAKE_ARGS: "-DGGML_VULKAN=ON"
        run: npm run tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candy-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
